function hasEquip(profile,eq){return profile.equipment.includes(eq);}
function hasAny(profile,arr){return arr.some(e=>profile.equipment.includes(e));}
function pick(profile,options){return options.find(e=>!e.needs||hasEquip(profile,e.needs))||options[options.length-1];}

function getReps(ex,exp){return ex.reps[exp==="Beginner — less than 1 year"?"b":exp==="Intermediate — 1 to 3 years"?"i":"a"];}

function buildExercise(ex,profile){return {name:ex.name,reps:getReps(ex,profile.experience),rest:ex.rest,tip:ex.tip};}

function selectExercises(profile,focus,count=6){
  const all=Object.values(EX);
  const pool=all.filter(e=>{
    if(e.focus!==focus&&!["chest","back","shoulders","triceps","biceps","legs","calves","core"].every(f=>f!==focus||e.focus===focus))return false;
    if(!e.needs)return true;
    return hasEquip(profile,e.needs);
  });
  const byFocus=all.filter(e=>e.focus===focus&&(!e.needs||hasEquip(profile,e.needs)));
  return byFocus.slice(0,count).map(e=>buildExercise(e,profile));
}

function generatePlan(profile){
  const days=parseInt(profile.days)||4;
  const goal=profile.goal;
  const exp=profile.experience;
  const isWheelchair=profile.mobility==="Wheelchair user";
  const isLimitedLower=profile.mobility==="Limited lower body"||isWheelchair;
  const isLimitedUpper=profile.mobility==="Limited upper body";

  // Sets per phase based on experience
  const phaseConf=[
    {phase:"PHASE 01",title:"Foundation",weeks:"Weeks 1–4",sets:exp.includes("Beginner")?3:4,rpe:"6–7/10",desc:`Building the foundation for your ${goal.toLowerCase()} journey.${isWheelchair?" Every exercise is adapted for seated training — full upper body development is absolutely achievable.":" Master the movements before adding intensity."}`},
    {phase:"PHASE 02",title:"Build",weeks:"Weeks 5–8",sets:4,rpe:"7–8/10",desc:`Increasing volume to drive ${goal==="Build muscle"?"muscle growth":"fat loss and muscle retention"}. Push harder each week.`},
    {phase:"PHASE 03",title:"Peak",weeks:"Weeks 9–12",sets:exp.includes("Advanced")?5:4,rpe:"8–9/10",desc:`Maximum intensity. Push close to failure on final sets. This is where your physique truly changes.`},
  ];

  // Wheelchair specific day templates — upper body only, all seated
  const wheelchairTemplates3=[
    {label:"DAY A",focus:"Chest · Shoulders · Triceps",groups:["chest","shoulders","triceps"],wheelchair:true},
    {label:"DAY B",focus:"Back · Biceps",groups:["back","biceps"],wheelchair:true},
    {label:"DAY C",focus:"Full Upper Body · Core",groups:["chest","back","shoulders","core"],wheelchair:true},
  ];
  const wheelchairTemplates4=[
    {label:"DAY A",focus:"Chest · Triceps",groups:["chest","triceps"],wheelchair:true},
    {label:"DAY B",focus:"Back · Biceps",groups:["back","biceps"],wheelchair:true},
    {label:"DAY C",focus:"Shoulders · Core",groups:["shoulders","core"],wheelchair:true},
    {label:"DAY D",focus:"Full Upper Body",groups:["chest","back","shoulders"],wheelchair:true},
  ];
  const wheelchairTemplates5=[
    {label:"DAY A",focus:"Chest · Triceps",groups:["chest","triceps"],wheelchair:true},
    {label:"DAY B",focus:"Back · Biceps",groups:["back","biceps"],wheelchair:true},
    {label:"DAY C",focus:"Shoulders",groups:["shoulders"],wheelchair:true},
    {label:"DAY D",focus:"Full Upper Push",groups:["chest","shoulders","triceps"],wheelchair:true},
    {label:"DAY E",focus:"Full Upper Pull · Core",groups:["back","biceps","core"],wheelchair:true},
  ];

  // Standard day templates
  const dayTemplates3=[
    {label:"DAY A",focus:"Full Body — Upper",groups:["chest","back","shoulders"]},
    {label:"DAY B",focus:"Full Body — Lower",groups:isLimitedLower?["chest","back","core"]:["legs","calves","core"]},
    {label:"DAY C",focus:"Full Body — Push/Pull",groups:["chest","back","biceps","triceps"]},
  ];
  const dayTemplates4=[
    {label:"DAY A",focus:"Chest · Shoulders · Triceps",groups:["chest","shoulders","triceps"]},
    {label:"DAY B",focus:"Back · Biceps",groups:["back","biceps"]},
    {label:"DAY C",focus:isLimitedLower?"Arms · Core":"Legs · Calves · Core",groups:isLimitedLower?["biceps","triceps","core"]:["legs","calves","core"]},
    {label:"DAY D",focus:"Full Body · Weak Points",groups:["chest","back","shoulders"]},
  ];
  const dayTemplates5=[
    {label:"DAY A",focus:"Chest · Triceps",groups:["chest","triceps"]},
    {label:"DAY B",focus:"Back · Biceps",groups:["back","biceps"]},
    {label:"DAY C",focus:isLimitedLower?"Shoulders · Core":"Legs · Calves",groups:isLimitedLower?["shoulders","core"]:["legs","calves"]},
    {label:"DAY D",focus:"Shoulders · Core",groups:["shoulders","core"]},
    {label:"DAY E",focus:"Full Body",groups:["chest","back","legs"]},
  ];

  const templates=isWheelchair
    ?(days===3?wheelchairTemplates3:days===5?wheelchairTemplates5:wheelchairTemplates4)
    :(days===3?dayTemplates3:days===5?dayTemplates5:dayTemplates4);

  const buildDays=()=>templates.map(tmpl=>{
    const exercises=[];
    tmpl.groups.forEach(group=>{
      const allEx=Object.values(EX).filter(e=>{
        if(e.focus!==group)return false;
        if(isWheelchair&&!e.wheelchair)return false;
        if(!e.needs)return true;
        return hasEquip(profile,e.needs);
      });
      // Fall back to non-wheelchair if no wheelchair exercises found for that group
      const fallback=Object.values(EX).filter(e=>e.focus===group&&(!e.needs||hasEquip(profile,e.needs)));
      const pool=allEx.length>0?allEx:fallback;
      const take=tmpl.groups.length===1?6:tmpl.groups.length===2?3:2;
      pool.slice(0,take).forEach(e=>exercises.push(buildExercise(e,profile)));
    });
    return {label:tmpl.label,focus:tmpl.focus,exercises:exercises.slice(0,6)};
  });

  // Nutrition targets
  const isLose=goal.includes("Lose")||goal.includes("fat");
  const isBuild=goal.includes("Build")||goal.includes("muscle");
  const nutrition={
    calories:isLose?"TDEE minus 300–500 calories":isBuild?"TDEE plus 200–300 calories":"Eat at your TDEE (maintenance)",
    protein:`${isLose?"1.2g":"1g"} per lb of bodyweight daily`,
    tips:[
      isLose?"Track your calories for at least 2 weeks — awareness is everything":"Eat in a small surplus. Not a big one.",
      isBuild?"Don't skip meals — consistency builds muscle":"Protein fills you up and protects muscle.",
      "Drink 3–4 litres of water every day",
      "Sleep 7–9 hours — this is non-negotiable for results",
      isWheelchair?"Upper body training burns significant calories — don't underestimate it":"Meal prep on Sunday to make the whole week easier",
    ],
  };

  const mobilityNote=isWheelchair?" Every exercise has been selected and adapted for seated training."
    :isLimitedLower?" Lower body exercises have been replaced with upper body alternatives."
    :isLimitedUpper?" We've focused the plan on what you can do comfortably."
    :profile.injuries&&profile.injuries!=="None"?` We've worked around your ${profile.injuries.toLowerCase()}.`:"";

  const summary=`This plan is built specifically for your goal to ${goal.toLowerCase()}. You'll train ${days} days per week using ${profile.equipment.length>0?profile.equipment.slice(0,2).join(" and ").toLowerCase():"bodyweight"}, progressing through 3 phases that get more intense as you go.${mobilityNote}`;

  return {
    summary,
    phases:phaseConf.map(ph=>({...ph,days:buildDays()})),
    nutrition,
    isWheelchair,
  };
}

  </button>;
}

function FInput({label,type="text",value,onChange,placeholder,error}){
  const [f,setF]=useState(false);

// ── AUTH ──────────────────────────────────────────────────────
function AuthForm({mode,onSuccess,onSwitch,onBack}){
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [errors,setErrors]=useState({});
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState("");
  const isUp=mode==="signup";

  const submit=async()=>{
    const e={};
    if(isUp&&!name.trim())e.name="Name is required";
    if(!email.includes("@"))e.email="Enter a valid email";
    if(pass.length<6)e.password="Min. 6 characters";
    if(Object.keys(e).length){setErrors(e);return;}
    setLoading(true);setErrors({});
    try{
      if(isUp){
        const res=await supa.signUp(email,pass,name);
        if(res.error){setErrors({email:res.error.message});setLoading(false);return;}
        if(res.access_token){
          const paid=await supa.getPaid(res.user.id,res.access_token);
          onSuccess({token:res.access_token,user:res.user,name,paid});
        }else{
          setMsg("✅ Account created! Check your email to confirm, then log in.");
        }
      }else{
        const res=await supa.signIn(email,pass);
        if(res.error){setErrors({email:res.error.message});setLoading(false);return;}
        const u=await supa.getUser(res.access_token);
        const paid=await supa.getPaid(u.id,res.access_token);
        onSuccess({token:res.access_token,user:u,name:u.user_metadata?.name||email,paid});
      }
    }catch{setErrors({email:"Something went wrong."});}
    setLoading(false);
  };

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 24px",borderBottom:`1px solid ${BO}`}}>
      <Logo/>
      <button onClick={onBack} style={{background:"none",border:"none",color:MU,fontSize:13,cursor:"pointer"}}>← Back</button>
    </nav>
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"40px 24px"}}>
      <div style={{width:"100%",maxWidth:400}}>
        <h2 style={{fontFamily:"Arial Black,Arial",fontSize:36,fontWeight:900,marginBottom:6}}>{isUp?"Create Account":"Welcome Back"}</h2>
        <p style={{fontSize:14,color:MU,marginBottom:28,lineHeight:1.6}}>{isUp?"Create your account to get started.":"Log in to access your plan."}</p>
        {msg
          ?<div style={{padding:"16px",background:"#1a1a00",border:`1px solid ${AC}44`,borderRadius:4,fontSize:14,color:AC,lineHeight:1.7}}>{msg}</div>
          :<>
            {isUp&&<FInput label="Full Name" value={name} onChange={setName} placeholder="Your name" error={errors.name}/>}
            <FInput label="Email" type="email" value={email} onChange={setEmail} placeholder="your@email.com" error={errors.email}/>
            <FInput label="Password" type="password" value={pass} onChange={setPass} placeholder="Min. 6 characters" error={errors.password}/>
            <Btn onClick={submit} disabled={loading}>{loading?"Please wait...":(isUp?"Create Account →":"Log In →")}</Btn>
            <div style={{textAlign:"center",marginTop:20,fontSize:13,color:MU}}>
              {isUp?"Already have an account?":"No account?"}{" "}
              <span onClick={onSwitch} style={{color:AC,cursor:"pointer",fontWeight:700}}>{isUp?"Log in":"Sign up"}</span>
            </div>
          </>
        }
      </div>
    </div>
  </div>;
}

              <div style={{fontSize:14,color:AC,fontWeight:700,textAlign:"center"}}>{p.sets}</div>
              <div style={{fontSize:13,color:"#ccc",textAlign:"center"}}>{ex.reps}</div>
              <div style={{fontSize:13,color:MU,textAlign:"center"}}>{ex.rest}</div>
            </div>
            {ex.tip&&<div style={{padding:"0 16px 10px",fontSize:12,color:"#555",fontStyle:"italic"}}>💡 {ex.tip}</div>}
          </div>
        ))}
        <div style={{marginTop:14,padding:"12px 16px",background:"#1a1a00",borderRadius:4,border:`1px solid ${AC}33`,fontSize:13,color:MU,lineHeight:1.6}}>
          <strong style={{color:"#fff"}}>Progressive overload:</strong> Add weight or reps every single week. This is the only rule that matters.
        </div>
      </>}

      {tab==="nutrition"&&<>
        <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900,marginBottom:6}}>Your Nutrition</h2>
        <p style={{fontSize:14,color:MU,marginBottom:24,lineHeight:1.6}}>Tailored to your goal: <strong style={{color:AC}}>{profile?.goal}</strong></p>
        {[
          {title:"Daily Calories",value:plan.nutrition?.calories},
          {title:"Daily Protein",value:plan.nutrition?.protein},
        ].map((item,i)=>(
          <div key={i} style={{padding:"16px 18px",background:i%2===0?CA:"#161616",borderRadius:6,marginBottom:8,borderLeft:`3px solid ${AC}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:15,fontWeight:700}}>{item.title}</div>
            <div style={{fontSize:13,fontWeight:700,color:AC}}>{item.value}</div>
          </div>
        ))}
        {plan.nutrition?.tips?.map((tip,i)=>(
          <div key={i} style={{padding:"14px 18px",background:"#161616",borderRadius:6,marginBottom:8,fontSize:14,color:MU,lineHeight:1.6}}>💡 {tip}</div>
        ))}
      </>}

      {tab==="tracker"&&<>
        <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900,marginBottom:6}}>Progress Tracker</h2>
        <p style={{fontSize:14,color:MU,marginBottom:24}}>Fill this in every 4 weeks. Progress that isn't tracked isn't progress.</p>
        {["Weight (kg)","Chest (cm)","Waist (cm)","Bench Press 1RM (kg)","Squat 1RM (kg)","Deadlift 1RM (kg)","Pull Ups (max reps)"].map((m,i)=>(
          <div key={i} style={{padding:"14px",background:CA,borderRadius:6,marginBottom:10,border:`1px solid ${B2}`}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>{m}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
              {["Week 1","Week 4","Week 8","Week 12"].map(w=>(
                <div key={w}>
                  <div style={{fontSize:10,color:MU,letterSpacing:"0.1em",marginBottom:4}}>{w.toUpperCase()}</div>
                  <input type="number" placeholder="—" style={{width:"100%",padding:"10px 8px",background:"#161616",color:"#fff",border:`1px solid ${B2}`,borderRadius:4,fontSize:14,textAlign:"center",fontFamily:"inherit",boxSizing:"border-box"}}/>
                </div>
              ))}
            </div>
          </div>
        ))}
      </>}

      {tab==="profile"&&<>
        <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900,marginBottom:6}}>Your Profile</h2>
        <p style={{fontSize:14,color:MU,marginBottom:24}}>Your plan is built around these answers.</p>
        {profile&&Object.entries({
          "Goal":profile.goal,
          "Training Days":`${profile.days} days per week`,
          "Location":profile.location,
          "Equipment":Array.isArray(profile.equipment)?profile.equipment.join(", "):profile.equipment,
          "Experience":profile.experience,
          "Injuries":profile.injuries||"None",
        }).map(([k,v])=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"14px 18px",background:CA,borderRadius:6,marginBottom:8,border:`1px solid ${B2}`,flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:13,color:MU}}>{k}</div>
            <div style={{fontSize:13,fontWeight:700,color:"#fff",textAlign:"right"}}>{v}</div>
          </div>
        ))}
        <div style={{marginTop:20}}>
          <Btn onClick={onNewPlan} ghost>Update Answers & Regenerate Plan</Btn>
        </div>
      </>}
    </div>
  </div>;
}

// ── APP ───────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("landing");
  const [session,setSession]=useState(null);
  const [name,setName]=useState("");
  const [plan,setPlan]=useState(null);
  const [profile,setProfile]=useState(null);

  // On load — restore session, clear any stale state
  useEffect(()=>{
    // Check for payment success first
    const params=new URLSearchParams(window.location.search);
    if(params.get("payment")==="success"){
      const saved=localStorage.getItem("fadl_session");
      if(saved){
        try{
          const s=JSON.parse(saved);
          supa.setPaid(s.user.id,s.token).then(()=>{
            const updated={...s,paid:true};
            localStorage.setItem("fadl_session",JSON.stringify(updated));
            setSession(updated);setName(updated.name||"");
            window.history.replaceState({},"",window.location.pathname);
            setScreen("questionnaire");
          });
        }catch{}
      }
      return;
    }

    const saved=localStorage.getItem("fadl_session");
    if(saved){
      try{
        const s=JSON.parse(saved);
        setSession(s);setName(s.name||"");
        // Always verify payment from Supabase — never trust localStorage cache
        supa.getPaid(s.user.id,s.token).then(isPaid=>{
          if(!isPaid){
            // Not paid — update cache and show payment screen
            const updated={...s,paid:false};
            localStorage.setItem("fadl_session",JSON.stringify(updated));
            setScreen("payment");
            return;
          }
          // Paid — update cache and check for existing plan
          const updated={...s,paid:true};
          localStorage.setItem("fadl_session",JSON.stringify(updated));
          supa.getPlan(s.user.id,s.token).then(existingPlan=>{
            if(existingPlan){
              setPlan(existingPlan);
              const savedProfile=localStorage.getItem("fadl_profile");
              if(savedProfile)setProfile(JSON.parse(savedProfile));
              setScreen("dashboard");
            }else{
              setScreen("questionnaire");
            }
          });
        }).catch(()=>setScreen("payment"));
      }catch{localStorage.removeItem("fadl_session");}
    }
  },[]);

  const handleAuth=(s)=>{
    setSession(s);setName(s.name||"");
    localStorage.setItem("fadl_session",JSON.stringify({...s,paid:false}));
    // Always check Supabase for payment status
    supa.getPaid(s.user.id,s.token).then(isPaid=>{
      if(!isPaid){setScreen("payment");return;}
      const updated={...s,paid:true};
      localStorage.setItem("fadl_session",JSON.stringify(updated));
      supa.getPlan(s.user.id,s.token).then(existing=>{
        if(existing){setPlan(existing);const sp=localStorage.getItem("fadl_profile");if(sp)setProfile(JSON.parse(sp));setScreen("dashboard");}
        else setScreen("questionnaire");
      });
    }).catch(()=>setScreen("payment"));
  };

  const handlePaid=()=>{
    const updated={...session,paid:true};
    setSession(updated);localStorage.setItem("fadl_session",JSON.stringify(updated));
    setScreen("questionnaire");
  };

  const handleQuestionnaire=(answers)=>{
    setProfile(answers);
    localStorage.setItem("fadl_profile",JSON.stringify(answers));
    setScreen("generating");
    // Small delay so generating screen shows
    setTimeout(()=>{
      const generated=generatePlan(answers);
      supa.savePlan(session.user.id,session.token,generated).then(()=>{
        setPlan(generated);setScreen("dashboard");
      }).catch(()=>{
        // Even if save fails, show the plan
        setPlan(generated);setScreen("dashboard");
      });
    },2800);
  };

  const handleLogout=async()=>{
    if(session?.token)await supa.signOut(session.token);
    localStorage.removeItem("fadl_session");
    localStorage.removeItem("fadl_profile");
    setSession(null);setPlan(null);setProfile(null);setScreen("landing");
  };

  const handleNewPlan=()=>{setScreen("questionnaire");};

  return <div style={{background:"#080808",color:"#fff",minHeight:"100vh",fontFamily:"'Helvetica Neue',Arial,sans-serif"}}>
    <style>{`*{box-sizing:border-box;margin:0;padding:0}button:active{opacity:0.85;transform:scale(0.98)}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}`}</style>
    {screen==="landing"      &&<Landing onSignup={()=>setScreen("signup")} onLogin={()=>setScreen("login")}/>}
    {screen==="signup"       &&<AuthForm mode="signup" onSuccess={handleAuth} onSwitch={()=>setScreen("login")} onBack={()=>setScreen("landing")}/>}
    {screen==="login"        &&<AuthForm mode="login" onSuccess={handleAuth} onSwitch={()=>setScreen("signup")} onBack={()=>setScreen("landing")}/>}
    {screen==="payment"      &&session&&<PaymentScreen session={session} onPaid={handlePaid}/>}
    {screen==="questionnaire"&&session&&<Questionnaire name={name} onComplete={handleQuestionnaire}/>}
    {screen==="generating"   &&<Generating/>}
    {screen==="dashboard"    &&session&&plan&&<Dashboard session={session} name={name} plan={plan} profile={profile} onLogout={handleLogout} onNewPlan={handleNewPlan}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
