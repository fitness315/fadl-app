function hasEquip(profile,eq){return profile.equipment.includes(eq);}
function hasAny(profile,arr){return arr.some(e=>profile.equipment.includes(e));}
function pick(profile,options){return options.find(e=>!e.needs||hasEquip(profile,e.needs))||options[options.length-1];}

function getReps(ex,exp){return ex.reps[exp==="Beginner (less than 1 year)"?"b":exp==="Intermediate (1 to 3 years)"?"i":"a"];}

function buildExercise(ex,profile){return {name:ex.name,reps:getReps(ex,profile.experience),rest:ex.rest,tip:ex.tip};}

function selectExercises(profile,focus,count=6){
  const all=Object.values(EX);
  const pool=all.filter(e=>{
    if(e.focus!==focus&&!["chest","back","shoulders","triceps","biceps","legs","calves","core"].every(f=>f!==focus||e.focus===focus))return false;
    if(!e.needs)return true;
    return hasEquip(profile,e.needs);
  });
  const byFocus=all.filter(e=>e.focus===focus&&(!e.needs||hasEquip(profile,e.needs)));
  return byFocus.slice(0,count).map(e=>buildExercise(e,profile));
}

  ];
  const dayTemplates4=[
    {label:"DAY 1",focus:"Chest · Shoulders · Triceps",groups:["chest","shoulders","triceps"]},
    {label:"DAY 2",focus:"Back · Biceps",groups:["back","biceps"]},
    {label:"DAY 3",focus:isLimitedLower?"Arms · Core":"Legs · Calves · Core",groups:isLimitedLower?["biceps","triceps","core"]:["legs","calves","core"]},
    {label:"DAY 4",focus:"Full Body · Weak Points",groups:["chest","back","shoulders"]},
  ];
  const dayTemplates5=[
    {label:"DAY 1",focus:"Chest · Triceps",groups:["chest","triceps"]},
    {label:"DAY 2",focus:"Back · Biceps",groups:["back","biceps"]},
    {label:"DAY 3",focus:isLimitedLower?"Shoulders · Core":"Legs · Calves",groups:isLimitedLower?["shoulders","core"]:["legs","calves"]},
    {label:"DAY 4",focus:"Shoulders · Core",groups:["shoulders","core"]},
    {label:"DAY 5",focus:"Full Body",groups:["chest","back","legs"]},
  ];
  const dayTemplates6=[
    {label:"DAY 1",focus:"Chest · Triceps",groups:["chest","triceps"]},
    {label:"DAY 2",focus:"Back · Biceps",groups:["back","biceps"]},
    {label:"DAY 3",focus:"Legs · Calves",groups:isLimitedLower?["shoulders","core"]:["legs","calves"]},
    {label:"DAY 4",focus:"Shoulders · Core",groups:["shoulders","core"]},
    {label:"DAY 5",focus:"Chest · Back",groups:["chest","back"]},
    {label:"DAY 6",focus:"Arms · Core",groups:["biceps","triceps","core"]},
  ];
  const dayTemplates7=[
    {label:"DAY 1",focus:"Chest · Triceps",groups:["chest","triceps"]},
    {label:"DAY 2",focus:"Back · Biceps",groups:["back","biceps"]},
    {label:"DAY 3",focus:"Legs · Calves",groups:isLimitedLower?["shoulders","core"]:["legs","calves"]},
    {label:"DAY 4",focus:"Shoulders",groups:["shoulders"]},
    {label:"DAY 5",focus:"Chest · Back",groups:["chest","back"]},
    {label:"DAY 6",focus:"Arms · Core",groups:["biceps","triceps","core"]},
    {label:"DAY 7",focus:"Active Recovery · Full Body",groups:["legs","shoulders","core"]},
  ];

  const templates=isWheelchair
    ?(days===3?wheelchairTemplates3:days===5?wheelchairTemplates5:wheelchairTemplates4)
    :(days===1?dayTemplates1:days===2?dayTemplates2:days===3?dayTemplates3:days===5?dayTemplates5:days===6?dayTemplates6:days===7?dayTemplates7:dayTemplates4);

  const buildDays=()=>templates.map(tmpl=>{
    const exercises=[];
    tmpl.groups.forEach(group=>{
      const allEx=Object.values(EX).filter(e=>{
        if(e.focus!==group)return false;
        if(isWheelchair&&!e.wheelchair)return false;
        if(!e.needs)return true;
        return hasEquip(profile,e.needs);
      });
      // Fall back to non-wheelchair if no wheelchair exercises found for that group
      const fallback=Object.values(EX).filter(e=>e.focus===group&&(!e.needs||hasEquip(profile,e.needs)));
      const pool=allEx.length>0?allEx:fallback;
      const take=tmpl.groups.length===1?6:tmpl.groups.length===2?3:2;
      pool.slice(0,take).forEach(e=>exercises.push(buildExercise(e,profile)));
    });
    return {label:tmpl.label,focus:tmpl.focus,exercises:exercises.slice(0,6)};
  });

  // Nutrition targets
  const isLose=goal.includes("Lose")||goal.includes("fat");
  const isBuild=goal.includes("Build")||goal.includes("muscle");
  const nutrition={
    calories:isLose?"TDEE minus 300–500 calories":isBuild?"TDEE plus 200–300 calories":"Eat at your TDEE (maintenance)",
    protein:`${isLose?"1.2g":"1g"} per lb of bodyweight daily`,
    tips:[
      isLose?"Track your calories for at least 2 weeks. Awareness is everything.":"Eat in a small surplus. Not a big one.",
      isBuild?"Don't skip meals. Consistency builds muscle.":"Protein fills you up and protects muscle.",
      "Drink 3–4 litres of water every day",
      "Sleep 7 to 9 hours. Non-negotiable for results.",
      isWheelchair?"Upper body training burns significant calories. Do not underestimate it.":"Meal prep on Sunday to make the whole week easier",
    ],
  };

  const mobilityNote=isWheelchair?" Every exercise has been selected and adapted for seated training."
    :isLimitedLower?" Lower body exercises have been replaced with upper body alternatives."
    :isLimitedUpper?" We've focused the plan on what you can do comfortably."
    :profile.injuries&&profile.injuries!=="None"?` We've worked around your ${profile.injuries.toLowerCase()}.`:"";

  const summary=`This plan is built specifically for your goal to ${goal.toLowerCase()}. You'll train ${days} days per week using ${profile.equipment.length>0?profile.equipment.slice(0,2).join(" and ").toLowerCase():"bodyweight"}, progressing through 3 phases that get more intense as you go.${mobilityNote}`;

  return {
    summary,
    phases:phaseConf.map(ph=>({...ph,days:buildDays()})),
    nutrition,
    isWheelchair,
  };
}

function AuthForm({mode,onSuccess,onSwitch,onBack}){
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [errors,setErrors]=useState({});
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState("");
  const isUp=mode==="signup";

  const submit=async()=>{
    const e={};
    if(isUp&&!name.trim())e.name="Name is required";
    if(!email.includes("@"))e.email="Enter a valid email";
    if(pass.length<6)e.password="Min. 6 characters";
    if(Object.keys(e).length){setErrors(e);return;}
    setLoading(true);setErrors({});
    try{
      if(isUp){
        const res=await supa.signUp(email,pass,name);
        if(res.error){setErrors({email:res.error.message});setLoading(false);return;}
        if(res.access_token){
          const paid=await supa.getPaid(res.user.id,res.access_token);
          onSuccess({token:res.access_token,user:res.user,name,paid});
        }else{
          setMsg("✅ Account created! Check your email to confirm, then log in.");
        }
      }else{
        const res=await supa.signIn(email,pass);
        if(res.error){setErrors({email:res.error.message});setLoading(false);return;}
        const u=await supa.getUser(res.access_token);
        const paid=await supa.getPaid(u.id,res.access_token);
        onSuccess({token:res.access_token,user:u,name:u.user_metadata?.name||email,paid});
      }
    }catch{setErrors({email:"Something went wrong."});}
    setLoading(false);
  };

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 24px",borderBottom:`1px solid ${BO}`}}>
      <Logo/>
      <button onClick={onBack} style={{background:"none",border:"none",color:MU,fontSize:13,cursor:"pointer"}}>← Back</button>
    </nav>
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"40px 24px"}}>
      <div style={{width:"100%",maxWidth:400}}>
        <h2 style={{fontFamily:"Arial Black,Arial",fontSize:36,fontWeight:900,marginBottom:6}}>{isUp?"Create Account":"Welcome Back"}</h2>
        <p style={{fontSize:14,color:MU,marginBottom:28,lineHeight:1.6}}>{isUp?"Create your account to get started.":"Log in to access your plan."}</p>
        {msg
          ?<div style={{padding:"16px",background:"#1a1a00",border:`1px solid ${AC}44`,borderRadius:4,fontSize:14,color:AC,lineHeight:1.7}}>{msg}</div>
          :<>
            {isUp&&<FInput label="Full Name" value={name} onChange={setName} placeholder="Your name" error={errors.name}/>}
            <FInput label="Email" type="email" value={email} onChange={setEmail} placeholder="your@email.com" error={errors.email}/>
            <FInput label="Password" type="password" value={pass} onChange={setPass} placeholder="Min. 6 characters" error={errors.password}/>
            <Btn onClick={submit} disabled={loading}>{loading?"Please wait...":(isUp?"Create Account →":"Log In →")}</Btn>
            <div style={{textAlign:"center",marginTop:20,fontSize:13,color:MU}}>
              {isUp?"Already have an account?":"No account?"}{" "}
              <span onClick={onSwitch} style={{color:AC,cursor:"pointer",fontWeight:700}}>{isUp?"Log in":"Sign up"}</span>
            </div>
          </>
        }
      </div>
    </div>
  </div>;
}

  const [ans,setAns]=useState({equipment:[]});
  const q=QS[step];
  const prog=(step/QS.length)*100;
  const answered=q.type==="multi"?(ans.equipment?.length>0):q.type==="text"?(ans[q.key]?.trim().length>0):(!!ans[q.key]);

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <div style={{height:3,background:"#1a1a1a"}}><div style={{height:"100%",background:AC,width:`${prog}%`,transition:"width 0.4s ease"}}/></div>
    <div style={{flex:1,display:"flex",flexDirection:"column",padding:"32px 20px",maxWidth:480,margin:"0 auto",width:"100%"}}>
      <div style={{fontSize:11,color:MU,letterSpacing:"0.15em",marginBottom:32}}>{step+1} OF {QS.length}</div>
      <div className="fadeIn" key={step}>
        <div style={{fontSize:48,marginBottom:16}}>{q.emoji}</div>
        <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900,lineHeight:1.1,marginBottom:24}}>{q.q}</h2>
        {q.type==="single"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          {q.options.map(o=>(
            <button key={o.v} onClick={()=>setAns(a=>({...a,[q.key]:o.v}))} style={{padding:"16px 20px",borderRadius:6,textAlign:"left",background:ans[q.key]===o.v?"#1a1a00":CA,border:`1px solid ${ans[q.key]===o.v?AC:B2}`,cursor:"pointer",fontFamily:"inherit"}}>
              <div style={{fontSize:15,fontWeight:700,color:ans[q.key]===o.v?AC:"#fff"}}>{o.l}</div>
              {o.d&&<div style={{fontSize:12,color:MU,marginTop:3}}>{o.d}</div>}
            </button>
          ))}
        </div>}
        {q.type==="multi"&&<div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {q.options.map(o=>{const sel=ans.equipment?.includes(o.v);return(
            <button key={o.v} onClick={()=>setAns(a=>{const c=a.equipment||[];return{...a,equipment:c.includes(o.v)?c.filter(x=>x!==o.v):[...c,o.v]};})} style={{padding:"10px 18px",borderRadius:100,background:sel?AC:CA,color:sel?"#080808":MU,border:`1px solid ${sel?AC:B2}`,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{o.l}</button>
          );})}
        </div>}
        {q.type==="text"&&<textarea value={ans[q.key]||""} onChange={e=>setAns(a=>({...a,[q.key]:e.target.value}))} placeholder={q.placeholder} rows={3}
          style={{width:"100%",padding:"14px 16px",background:"#161616",color:"#fff",border:`1px solid ${B2}`,borderRadius:4,fontSize:15,fontFamily:"inherit",resize:"none",boxSizing:"border-box"}}/>}
      </div>
      <div style={{marginTop:"auto",paddingTop:32}}>
        <Btn onClick={()=>{if(step<QS.length-1)setStep(s=>s+1);else onComplete({...ans,name});}} disabled={!answered}>
          {step<QS.length-1?"Next →":"Generate My Plan →"}
        </Btn>
        {step>0&&<button onClick={()=>setStep(s=>s-1)} style={{width:"100%",padding:14,marginTop:10,background:"none",border:"none",color:MU,fontSize:13,cursor:"pointer"}}>← Back</button>}
      </div>
    </div>
  </div>;
}

// ── GENERATING ────────────────────────────────────────────────
function Generating(){
  const [msg,setMsg]=useState(0);
  const msgs=["Analysing your goal...","Selecting exercises for your equipment...","Building your 3 phase structure...","Personalising your nutrition...","Your plan is ready!"];
  useEffect(()=>{const t=setInterval(()=>setMsg(i=>Math.min(i+1,msgs.length-1)),600);return()=>clearInterval(t);},[]);
  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center"}}>
    <div style={{width:56,height:56,border:"3px solid #1a1a1a",borderTopColor:AC,borderRadius:"50%",marginBottom:28}} className="spin"/>
    <div style={{fontFamily:"Arial Black,Arial",fontSize:26,fontWeight:900,marginBottom:12}}>Building Your Plan</div>
    <div style={{fontSize:15,color:MU}}>{msgs[msg]}</div>
  </div>;
}

// ── TRACKER ───────────────────────────────────────────────────
const METRICS=["Weight (kg)","Chest (cm)","Waist (cm)","Arm (cm)","Waist (cm)","Bench Press 1RM (kg)","Squat 1RM (kg)","Deadlift 1RM (kg)","Pull Ups (max reps)"];
const WEEKS=["Week 1","Week 4","Week 8","Week 12"];

function Tracker({session}){
  const [data,setData]=useState({});
  const [saved,setSaved]=useState(false);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    // Load from localStorage first for instant display
    const local=localStorage.getItem("fadl_tracker");
    if(local){try{setData(JSON.parse(local));}catch{}}
    // Then try Supabase for the saved version
    supa.getTracker(session.user.id,session.token).then(d=>{
      if(d){
        setData(d);
        localStorage.setItem("fadl_tracker",JSON.stringify(d));
      }
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  const update=(metric,week,val)=>{
    setSaved(false);
    setData(d=>{
      const updated={...d,[metric]:{...(d[metric]||{}),[week]:val}};
      localStorage.setItem("fadl_tracker",JSON.stringify(updated));
      return updated;
    });
  };

  const save=async()=>{
    setSaving(true);
    localStorage.setItem("fadl_tracker",JSON.stringify(data));
    await supa.saveTracker(session.user.id,session.token,data);
    setSaving(false);setSaved(true);
    setTimeout(()=>setSaved(false),3000);
  };

  if(loading)return <div style={{padding:40,textAlign:"center",color:MU}}>Loading your progress...</div>;

  return <>
    <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900,marginBottom:6}}>Progress Tracker</h2>
    <p style={{fontSize:14,color:MU,marginBottom:24,lineHeight:1.6}}>Fill this in every 4 weeks. Your data saves automatically to your account — never lose your progress.</p>

    {METRICS.map((m,i)=>(
      <div key={i} style={{padding:"14px",background:CA,borderRadius:6,marginBottom:10,border:`1px solid ${B2}`}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>{m}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {WEEKS.map(w=>(
            <div key={w}>
              <div style={{fontSize:10,color:MU,letterSpacing:"0.1em",marginBottom:4}}>{w.toUpperCase()}</div>
              <input type="number" placeholder="—" value={data[m]?.[w]||""}
                onChange={e=>update(m,w,e.target.value)}
                style={{width:"100%",padding:"10px 8px",background:"#161616",color:"#fff",border:`1px solid ${B2}`,borderRadius:4,fontSize:14,textAlign:"center",fontFamily:"inherit",boxSizing:"border-box"}}/>
            </div>
          ))}
        </div>
      </div>
    ))}

    <button onClick={save} disabled={saving} style={{width:"100%",padding:"15px",background:saved?"#1a3300":AC,color:saved?"#7fff00":CA,fontSize:15,fontWeight:900,letterSpacing:"0.1em",textTransform:"uppercase",border:`1px solid ${saved?"#2a5500":"transparent"}`,borderRadius:4,cursor:saving?"not-allowed":"pointer",fontFamily:"inherit",marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
      {saving&&<div style={{width:16,height:16,border:"2px solid #555",borderTopColor:CA,borderRadius:"50%"}} className="spin"/>}
      {saved?"✅ Progress Saved!":saving?"Saving...":"Save My Progress"}
    </button>

    <div style={{marginTop:12,padding:"12px 16px",background:"#111",borderRadius:6,fontSize:13,color:MU,lineHeight:1.7}}>
      💡 Fill in <strong style={{color:"#fff"}}>Week 1</strong> when you start. Come back every 4 weeks to update. Your data is saved to your account and will be here every time you log in.
    </div>
  </>;
}

// ── NUTRITION GUIDE ───────────────────────────────────────────
function NutritionGuide({profile,plan}){
  const [weightKg,setWeightKg]=useState("");
  const [heightCm,setHeightCm]=useState("");
  const [age,setAge]=useState("");
  const [sex,setSex]=useState("");
  const [activity,setActivity]=useState("");
  const [diet,setDiet]=useState("");
  const [meals,setMeals]=useState("");
  const [calculated,setCalculated]=useState(null);
  const [step,setStep]=useState("intro"); // intro | form | results

  const goal=profile?.goal||"Build muscle";
  const isLose=goal.includes("Lose")||goal.includes("fat");
  const isBuild=goal.includes("Build")||goal.includes("muscle");

  const activityMults={
    "Sedentary (desk job, little exercise)":1.2,
    "Lightly active (1-3 days training)":1.375,
    "Moderately active (3-5 days training)":1.55,
    "Very active (6-7 days hard training)":1.725,
  };

  const calculate=()=>{
    const w=parseFloat(weightKg);
    const h=parseFloat(heightCm);
    const a=parseInt(age);
    if(!w||!h||!a||!sex||!activity)return;

    // Mifflin-St Jeor BMR
    const bmr=sex==="Prefer not to say"
      ?(((10*w)+(6.25*h)-(5*a)+5)+((10*w)+(6.25*h)-(5*a)-161))/2 // average of male and female
      :sex==="Male"
      ?(10*w)+(6.25*h)-(5*a)+5
      :(10*w)+(6.25*h)-(5*a)-161;

    const tdee=Math.round(bmr*(activityMults[activity]||1.55));
    const targetCals=isLose?tdee-400:isBuild?tdee+250:tdee;
    const proteinG=Math.round(w*2.2*(isLose?1.2:1.0));
    const fatG=Math.round(targetCals*0.25/9);
    const carbG=Math.round((targetCals-(proteinG*4)-(fatG*9))/4);

    // Meal split
    const mealCount=parseInt(meals)||3;
    const calsPerMeal=Math.round(targetCals/mealCount);
    const proteinPerMeal=Math.round(proteinG/mealCount);

    // Food lists based on diet preference
    const proteins={
      "No preference":["Chicken breast","Lean beef mince","Salmon","Tuna","Eggs","Greek yogurt","Cottage cheese","Whey protein"],
      "Vegetarian":["Eggs","Greek yogurt","Cottage cheese","Whey protein","Tempeh","Edamame","Lentils","Chickpeas"],
      "Vegan":["Tempeh","Edamame","Lentils","Chickpeas","Tofu","Hemp seeds","Pea protein","Black beans"],
      "Dairy free":["Chicken breast","Lean beef","Salmon","Tuna","Eggs","Tempeh","Lentils","Pea protein"],
    };
    const carbs=["Oats","White rice","Sweet potato","Wholegrain bread","Banana","Pasta","Rice cakes","Fruit"];
    const fats=["Avocado","Olive oil","Nuts","Nut butter","Eggs","Salmon","Seeds","Dark chocolate"];
    const veg=["Spinach","Broccoli","Peppers","Cucumber","Tomatoes","Courgette","Green beans","Kale"];

    // Sample meals based on diet and goal
    const mealPlans={
      3:{
        "No preference":[
          {time:"Breakfast",meal:"Oats with banana, 2 eggs scrambled",cals:Math.round(calsPerMeal*0.3),protein:Math.round(proteinPerMeal*0.3)},
          {time:"Lunch",meal:"Chicken breast, white rice, mixed veg",cals:Math.round(calsPerMeal*1.1),protein:Math.round(proteinPerMeal*1.1)},
          {time:"Dinner",meal:"Salmon, sweet potato, broccoli",cals:Math.round(calsPerMeal*1.1),protein:Math.round(proteinPerMeal*1.1)},
        ],
        "Vegetarian":[
          {time:"Breakfast",meal:"Greek yogurt, oats, banana, nut butter",cals:Math.round(calsPerMeal*0.9),protein:Math.round(proteinPerMeal*0.9)},
          {time:"Lunch",meal:"Tempeh stir fry with rice and veg",cals:Math.round(calsPerMeal),protein:Math.round(proteinPerMeal)},
          {time:"Dinner",meal:"Lentil curry with rice, cottage cheese on side",cals:Math.round(calsPerMeal*1.1),protein:Math.round(proteinPerMeal*1.1)},
        ],
        "Vegan":[
          {time:"Breakfast",meal:"Oats with pea protein, banana, nut butter",cals:Math.round(calsPerMeal*0.9),protein:Math.round(proteinPerMeal*0.9)},
          {time:"Lunch",meal:"Tofu stir fry with rice and broccoli",cals:Math.round(calsPerMeal),protein:Math.round(proteinPerMeal)},
          {time:"Dinner",meal:"Lentil and chickpea curry, brown rice",cals:Math.round(calsPerMeal*1.1),protein:Math.round(proteinPerMeal*1.1)},
        ],
        "Dairy free":[
          {time:"Breakfast",meal:"Eggs, oats with banana, black coffee",cals:Math.round(calsPerMeal*0.9),protein:Math.round(proteinPerMeal*0.9)},
          {time:"Lunch",meal:"Chicken, rice, mixed veg, olive oil",cals:Math.round(calsPerMeal),protein:Math.round(proteinPerMeal)},
          {time:"Dinner",meal:"Salmon, sweet potato, green beans",cals:Math.round(calsPerMeal*1.1),protein:Math.round(proteinPerMeal*1.1)},
        ],
      },
    };

    const dietKey=diet||"No preference";
    const sampleMeals=mealPlans[3][dietKey]||mealPlans[3]["No preference"];

    setCalculated({tdee,targetCals,proteinG,fatG,carbG,calsPerMeal,proteinPerMeal,
      proteins:proteins[dietKey]||proteins["No preference"],carbs,fats,veg,sampleMeals,mealCount});
    setStep("results");
  };

  if(step==="intro") return <>
    <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900,marginBottom:6}}>Your Nutrition Guide</h2>
    <p style={{fontSize:14,color:MU,marginBottom:24,lineHeight:1.6}}>Personalised calorie and macro targets based on your body and goal.</p>
    <div style={{padding:"20px",background:"#1a1a00",borderRadius:6,border:`1px solid ${AC}33`,marginBottom:24,fontSize:14,color:"#ccc",lineHeight:1.7}}>
      ⚠️ <strong style={{color:AC}}>Important:</strong> This is general fitness nutrition guidance only. It is not medical advice. If you have a medical condition, food allergy or specific dietary requirement please consult a qualified healthcare professional before making changes to your diet.
    </div>
    <div style={{padding:"24px",background:CA,borderRadius:8,border:`1px solid ${B2}`,marginBottom:16}}>
      <div style={{fontFamily:"Arial Black,Arial",fontSize:20,fontWeight:900,marginBottom:8}}>What you'll get</div>
      {["Your personalised daily calorie target","Protein, carb and fat targets in grams","A sample meal plan for your goal","Best foods for your dietary preference","Supplement recommendations","Meal timing around your training"].map((item,i)=>(
        <div key={i} style={{fontSize:14,color:MU,marginBottom:6,paddingLeft:4}}>✓ {item}</div>
      ))}
    </div>
    <Btn onClick={()=>setStep("form")}>Calculate My Nutrition →</Btn>
    <div style={{marginTop:12,fontSize:12,color:"#444",textAlign:"center",lineHeight:1.7}}>
      Takes 60 seconds. Based on your body stats, goal and dietary preferences.
    </div>
  </>;

  if(step==="form") return <>
    <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900,marginBottom:6}}>Your Details</h2>
    <p style={{fontSize:14,color:MU,marginBottom:24}}>Fill in your stats to get accurate targets.</p>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:4}}>
      <div>
        <label style={{fontSize:11,fontWeight:700,color:MU,letterSpacing:"0.15em",textTransform:"uppercase",display:"block",marginBottom:8}}>Weight (kg)</label>
        <input type="number" value={weightKg} onChange={e=>setWeightKg(e.target.value)} placeholder="e.g. 80"
          style={{width:"100%",padding:"14px",background:"#161616",color:"#fff",border:`1px solid ${B2}`,borderRadius:4,fontSize:15,fontFamily:"inherit",boxSizing:"border-box"}}/>
      </div>
      <div>
        <label style={{fontSize:11,fontWeight:700,color:MU,letterSpacing:"0.15em",textTransform:"uppercase",display:"block",marginBottom:8}}>Height (cm)</label>
        <input type="number" value={heightCm} onChange={e=>setHeightCm(e.target.value)} placeholder="e.g. 175"
          style={{width:"100%",padding:"14px",background:"#161616",color:"#fff",border:`1px solid ${B2}`,borderRadius:4,fontSize:15,fontFamily:"inherit",boxSizing:"border-box"}}/>
      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
      <div>
        <label style={{fontSize:11,fontWeight:700,color:MU,letterSpacing:"0.15em",textTransform:"uppercase",display:"block",marginBottom:8}}>Age</label>
        <input type="number" value={age} onChange={e=>setAge(e.target.value)} placeholder="e.g. 25"
          style={{width:"100%",padding:"14px",background:"#161616",color:"#fff",border:`1px solid ${B2}`,borderRadius:4,fontSize:15,fontFamily:"inherit",boxSizing:"border-box"}}/>
      </div>
      <div>
        <label style={{fontSize:11,fontWeight:700,color:MU,letterSpacing:"0.15em",textTransform:"uppercase",display:"block",marginBottom:4}}>Biological Sex</label>
        <div style={{fontSize:11,color:"#444",marginBottom:8}}>Used for calorie calculation only</div>
        <select value={sex} onChange={e=>setSex(e.target.value)}
          style={{width:"100%",padding:"14px",background:"#161616",color:sex?"#fff":MU,border:`1px solid ${B2}`,borderRadius:4,fontSize:15,fontFamily:"inherit",boxSizing:"border-box"}}>
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
      </div>
    </div>

    <div style={{marginBottom:16}}>
      <label style={{fontSize:11,fontWeight:700,color:MU,letterSpacing:"0.15em",textTransform:"uppercase",display:"block",marginBottom:10}}>Activity Level</label>
      {["Sedentary (desk job, little exercise)","Lightly active (1-3 days training)","Moderately active (3-5 days training)","Very active (6-7 days hard training)"].map(o=>(
        <button key={o} onClick={()=>setActivity(o)} style={{display:"block",width:"100%",padding:"13px 16px",marginBottom:6,borderRadius:4,textAlign:"left",background:activity===o?"#1a1a00":CA,border:`1px solid ${activity===o?AC:B2}`,color:activity===o?AC:"#aaa",fontSize:13,fontFamily:"inherit",cursor:"pointer"}}>
          {o}
        </button>
      ))}
    </div>

    <div style={{marginBottom:16}}>
      <label style={{fontSize:11,fontWeight:700,color:MU,letterSpacing:"0.15em",textTransform:"uppercase",display:"block",marginBottom:10}}>Dietary Preference</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {["No preference","Vegetarian","Vegan","Dairy free"].map(o=>(
          <button key={o} onClick={()=>setDiet(o)} style={{padding:"10px 18px",borderRadius:100,background:diet===o?AC:CA,color:diet===o?"#080808":MU,border:`1px solid ${diet===o?AC:B2}`,fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>
            {o}
          </button>
        ))}
      </div>
    </div>

    <div style={{marginBottom:24}}>
      <label style={{fontSize:11,fontWeight:700,color:MU,letterSpacing:"0.15em",textTransform:"uppercase",display:"block",marginBottom:10}}>How many meals per day?</label>
      <div style={{display:"flex",gap:8}}>
        {["1","2","3","4","5"].map(o=>(
          <button key={o} onClick={()=>setMeals(o)} style={{flex:1,padding:"13px 4px",borderRadius:4,background:meals===o?AC:CA,color:meals===o?"#080808":MU,border:`1px solid ${meals===o?AC:B2}`,fontSize:15,fontWeight:900,fontFamily:"inherit",cursor:"pointer"}}>
            {o}
          </button>
        ))}
      </div>
    </div>

    <Btn onClick={calculate} disabled={!weightKg||!heightCm||!age||!sex||!activity||!diet||!meals}>
      Generate My Nutrition Plan →
    </Btn>
    <button onClick={()=>setStep("intro")} style={{width:"100%",padding:14,marginTop:10,background:"none",border:"none",color:MU,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Back</button>
  </>;

  if(step==="results"&&calculated) return <>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <h2 style={{fontFamily:"Arial Black,Arial",fontSize:28,fontWeight:900}}>Your Nutrition Plan</h2>
      <button onClick={()=>setStep("form")} style={{padding:"8px 16px",background:"#1a1a1a",border:`1px solid ${B2}`,color:MU,fontSize:12,borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Recalculate</button>
    </div>

    <div style={{padding:"14px 18px",background:"#1a1a00",borderRadius:6,border:`1px solid ${AC}33`,marginBottom:20,fontSize:14,color:"#ccc",lineHeight:1.7}}>
      🎯 <strong style={{color:AC}}>Goal: {goal}</strong> · Based on your body stats and activity level
    </div>

    {/* Main targets */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:20}}>
      {[
        {label:"Daily Calories",value:`${calculated.targetCals}`,unit:"kcal",big:true},
        {label:"Daily Protein",value:`${calculated.proteinG}`,unit:"g"},
        {label:"Daily Carbs",value:`${calculated.carbG}`,unit:"g"},
        {label:"Daily Fats",value:`${calculated.fatG}`,unit:"g"},
      ].map((s,i)=>(
        <div key={i} style={{padding:"20px",background:CA,borderRadius:6,border:`1px solid ${B2}`,borderLeft:i===0?`3px solid ${AC}`:`1px solid ${B2}`,textAlign:"center"}}>
          <div style={{fontFamily:"Arial Black,Arial",fontSize:i===0?40:32,fontWeight:900,color:i===0?AC:"#fff",lineHeight:1}}>{s.value}</div>
          <div style={{fontSize:12,color:AC,fontWeight:700,marginTop:4}}>{s.unit}</div>
          <div style={{fontSize:11,color:MU,letterSpacing:"0.1em",textTransform:"uppercase",marginTop:4}}>{s.label}</div>
        </div>
      ))}
    </div>

    {/* TDEE info */}
    <div style={{padding:"14px 18px",background:"#161616",borderRadius:6,border:`1px solid ${B2}`,marginBottom:20,fontSize:13,color:MU,lineHeight:1.7}}>
      Your maintenance calories (TDEE) are <strong style={{color:"#fff"}}>{calculated.tdee} kcal</strong>. 
      {isLose?` Eating ${calculated.targetCals} kcal puts you in a deficit of ${calculated.tdee-calculated.targetCals} kcal per day.`
      :isBuild?` Eating ${calculated.targetCals} kcal puts you in a surplus of ${calculated.targetCals-calculated.tdee} kcal per day.`
      :` Eating ${calculated.targetCals} kcal keeps you at maintenance.`}
    </div>

    {/* Per meal breakdown */}
    <div style={{padding:"16px 18px",background:CA,borderRadius:6,border:`1px solid ${B2}`,marginBottom:20}}>

function MindsetGuide(){
  const principles=[
    {icon:"🎯",title:"Consistency beats perfection",desc:"Perfect doesn't exist. Consistent does. A mediocre session you actually did beats a perfect one you skipped."},
    {icon:"🔁",title:"Stack the habit, not the motivation",desc:"Motivation fades. Attach training to something you already do daily — after coffee, after work, before dinner — so it stops being a decision."},
    {icon:"📉",title:"Expect the dip",desc:"Weeks 3–5 are where most people quit. Progress slows and it stops feeling new. This is normal, not a sign it isn't working."},
    {icon:"🧱",title:"Lower the bar on bad days",desc:"Can't face the full session? Do 10 minutes. Showing up beats a full workout you never start. Momentum matters more than intensity."},
    {icon:"📵",title:"Ignore comparison",desc:"Your only competition is the version of you from 12 weeks ago. Other people's timelines, bodies and routines are irrelevant to yours."},
  ];

  const restartScript=[
    "Missing one session never breaks a plan — quitting after it does.",
    "Don't try to 'make up' missed sessions. Just resume the next one as scheduled.",
    "Ask what got in the way, fix that one thing, and move on. No guilt spirals.",
    "Re-read your original reason for starting before you decide to stop.",
  ];

  const checkIn=[
    "Did I train the days I planned to this week?",
    "Am I recovering — sleep, food, stress — or just grinding?",
    "What nearly stopped me this week, and what will I do differently?",
    "What's one thing that went right, even if small?",
  ];

  return <>

    <div style={{marginBottom:24}}>

        <div key={i} style={{padding:"16px 18px",background:CA,borderRadius:8,border:`1px solid ${B2}`,marginBottom:10}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
            <div style={{fontSize:22}}>{p.icon}</div>

              <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{p.title}</div>

            </div>

          <span>{line}</span>

// ── APP ───────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("landing");
  const [session,setSession]=useState(null);
  const [name,setName]=useState("");
  const [plan,setPlan]=useState(null);
  const [profile,setProfile]=useState(null);

  // On load — restore session, clear any stale state
  useEffect(()=>{
    // Check for payment success first
    const params=new URLSearchParams(window.location.search);
    if(params.get("payment")==="success"){
      const saved=localStorage.getItem("fadl_session");
      if(saved){
        try{
          const s=JSON.parse(saved);
          supa.setPaid(s.user.id,s.token).then(()=>{
            const updated={...s,paid:true};
            localStorage.setItem("fadl_session",JSON.stringify(updated));
            setSession(updated);setName(updated.name||"");
            window.history.replaceState({},"",window.location.pathname);
            setScreen("questionnaire");
          });
        }catch{}
      }
      return;
    }

    const saved=localStorage.getItem("fadl_session");
    if(saved){
      try{
        const s=JSON.parse(saved);
        setSession(s);setName(s.name||"");

        // If localStorage says paid, trust it and go straight to dashboard
        // then verify in background — don't make user pay again on token expiry
        if(s.paid===true){
          supa.getPlan(s.user.id,s.token).then(existingPlan=>{
            if(existingPlan){
              setPlan(existingPlan);
              const savedProfile=localStorage.getItem("fadl_profile");
              if(savedProfile)setProfile(JSON.parse(savedProfile));
              setScreen("dashboard");
            }else{
              setScreen("questionnaire");
            }
          }).catch(()=>{
            // Can't load plan — token expired, send to login for fresh token
            localStorage.removeItem("fadl_session");
            setScreen("login");
          });
          return;
        }

        // Not marked as paid in localStorage — check Supabase
        supa.getPaid(s.user.id,s.token).then(isPaid=>{
          if(isPaid===null){
            // Token expired — send to login
            localStorage.removeItem("fadl_session");
            setSession(null);
            setScreen("login");
            return;
          }
          if(isPaid){
            const updated={...s,paid:true};
            localStorage.setItem("fadl_session",JSON.stringify(updated));
            supa.getPlan(s.user.id,s.token).then(existingPlan=>{
              if(existingPlan){
                setPlan(existingPlan);
                const savedProfile=localStorage.getItem("fadl_profile");
                if(savedProfile)setProfile(JSON.parse(savedProfile));
                setScreen("dashboard");
              }else{
                setScreen("questionnaire");
              }
            });
          }else{
            setScreen("payment");
          }
        }).catch(()=>{
          localStorage.removeItem("fadl_session");
          setScreen("login");
        });
      }catch{localStorage.removeItem("fadl_session");}
    }
  },[]);

  const handleAuth=(s)=>{
    setSession(s);setName(s.name||"");
    supa.getPaid(s.user.id,s.token).then(isPaid=>{
      if(isPaid===true){
        const updated={...s,paid:true};
        localStorage.setItem("fadl_session",JSON.stringify(updated));
        setSession(updated);
        supa.getPlan(s.user.id,s.token).then(existing=>{
          if(existing){setPlan(existing);const sp=localStorage.getItem("fadl_profile");if(sp)setProfile(JSON.parse(sp));setScreen("dashboard");}
          else setScreen("questionnaire");
        });
      }else{
        localStorage.setItem("fadl_session",JSON.stringify({...s,paid:false}));
        setScreen("payment");
      }
    }).catch(()=>{
      localStorage.setItem("fadl_session",JSON.stringify({...s,paid:false}));
      setScreen("payment");
    });
  };

  const handlePaid=()=>{
    const updated={...session,paid:true};
    setSession(updated);localStorage.setItem("fadl_session",JSON.stringify(updated));
    setScreen("questionnaire");
  };

  const handleQuestionnaire=(answers)=>{
    setProfile(answers);
    localStorage.setItem("fadl_profile",JSON.stringify(answers));
    setScreen("generating");
    // Small delay so generating screen shows
    setTimeout(()=>{
      const generated=generatePlan(answers);
      supa.savePlan(session.user.id,session.token,generated).then(()=>{
        setPlan(generated);setScreen("dashboard");
      }).catch(()=>{
        // Even if save fails, show the plan
        setPlan(generated);setScreen("dashboard");
      });
    },2800);
  };

  const handleLogout=async()=>{
    if(session?.token)await supa.signOut(session.token);
    localStorage.removeItem("fadl_session");
    localStorage.removeItem("fadl_refresh");
    localStorage.removeItem("fadl_profile");
    setSession(null);setPlan(null);setProfile(null);setScreen("landing");
  };

  const handleNewPlan=()=>{setScreen("questionnaire");};

  return <div style={{background:"#080808",color:"#fff",minHeight:"100vh",fontFamily:"'Helvetica Neue',Arial,sans-serif"}}>
    <style>{`*{box-sizing:border-box;margin:0;padding:0}button:active{opacity:0.85;transform:scale(0.98)}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}`}</style>
    {screen==="landing"      &&<Landing onSignup={()=>setScreen("signup")} onLogin={()=>setScreen("login")}/>}
    {screen==="signup"       &&<AuthForm mode="signup" onSuccess={handleAuth} onSwitch={()=>setScreen("login")} onBack={()=>setScreen("landing")}/>}
    {screen==="login"        &&<AuthForm mode="login" onSuccess={handleAuth} onSwitch={()=>setScreen("signup")} onBack={()=>setScreen("landing")}/>}
    {screen==="payment"      &&session&&<PaymentScreen session={session} onPaid={handlePaid}/>}
    {screen==="questionnaire"&&session&&<Questionnaire name={name} onComplete={handleQuestionnaire}/>}
    {screen==="generating"   &&<Generating/>}
    {screen==="dashboard"    &&session&&plan&&<Dashboard session={session} name={name} plan={plan} profile={profile} onLogout={handleLogout} onNewPlan={handleNewPlan}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((err) => console.log("SW registration failed", err));
  });
}
</script>
</body>
</html>
